name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux finds its own executable through /proc/self/exe and the parent shell through /proc,
        # macOS through _NSGetExecutablePath and proc_name (crates/h-core/src/{exe,shell}.rs), so
        # both are built, tested (nix build runs cargo test) and smoke-tested
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix build --print-build-logs
      - name: Smoke test
        run: |
          set -euo pipefail
          out=$(readlink -f result)
          export PATH="$out/bin:$PATH"
          for program in h h-shell-init up up-shell-init; do
            "$program" --version | grep -E "^$program [0-9]+\.[0-9]+\.[0-9]+$"
          done
          # run from $PATH in another directory: the generated functions must call the h and up
          # next to the init programs, not ./h in the current directory
          cd "$RUNNER_TEMP"
          h-shell-init --name h ~/code | grep -F "command $out/bin/h --root"
          h-shell-init --name hq --git-opts '-c user.name=x' ~/code | grep -F "command $out/bin/h --root"
          up-shell-init | grep -F "command $out/bin/up"
          # completion follows the parent shell (/proc on Linux, proc_name on macOS). The `; :`
          # keeps the shell from exec'ing h-shell-init in its place
          bash -c 'h-shell-init ~/code; :' | grep -Fx 'complete -F _h_complete h'
          nix shell --inputs-from "$GITHUB_WORKSPACE" nixpkgs#zsh --command zsh -fc 'h-shell-init ~/code; :' | grep -Fx 'compdef _h_complete h'
          # the functions themselves: h finds a project, up goes back to its root
          project=~/code/github.com/example/project
          mkdir -p "$project/src/deeper"
          git init -q "$project"
          eval "$(h-shell-init ~/code)"
          eval "$(up-shell-init)"
          h project
          test "$PWD" = "$project"
          cd src/deeper
          up
          test "$PWD" = "$project"
          # the store: created on first use, read without a working tree
          git -C "$project" -c user.name=ci -c user.email=ci@example.com -c commit.gpgsign=false commit -q --allow-empty -m init
          eval "$(h-shell-init --store ~/store ~/code)"
          h store add "file://$project"
          h store show project HEAD | grep -F init

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: rustfmt
        run: nix develop --command cargo fmt --all --check
      - name: clippy
        run: nix develop --command cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: nixfmt
        run: nix shell --inputs-from . nixpkgs#nixfmt --command nixfmt --check flake.nix
