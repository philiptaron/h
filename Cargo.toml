[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
h-core = { path = "crates/h-core" }
h-git = { path = "crates/h-git" }
serde_json = "1.0.151"
tempfile = "3.27.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
